spring:
  application:
    name: BE
  config:
    # Carica BE/.env (non committato) se presente; su Render si usano le env var della dashboard
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 50

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:noreply@salone-auto.it}
  jwt:
    # Almeno 32 caratteri (HS256)
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT24H}
  autodev:
    base-url: https://api.auto.dev
    api-key: ${AUTODEV_API_KEY:}
  catalog-seed:
    # true solo per popolare un catalogo vuoto (consuma 3-4 chiamate della quota auto.dev)
    enabled: ${CATALOG_SEED:false}
    size: 50
    marche: Porsche,Ferrari,Lamborghini,Bentley,Rolls-Royce,Aston Martin,Maserati,McLaren,Mercedes-Benz,BMW
    fascia-prezzo: 90000-2000000
  admin:
    nome: ${ADMIN_NOME:Super}
    cognome: ${ADMIN_COGNOME:Admin}
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@salone-auto.it}
    password: ${ADMIN_PASSWORD:}
