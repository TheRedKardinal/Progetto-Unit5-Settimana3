<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Conferma il tuo indirizzo email</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background:#1f2933;color:#ffffff;padding:20px 32px;font-size:20px;font-weight:bold;">
                        Salone Auto
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;font-size:15px;line-height:1.6;">
                        <p style="margin:0 0 16px;">Ciao <strong th:text="${nome}">Mario</strong>,</p>
                        <p style="margin:0 0 16px;">
                            grazie per esserti registrato. Per attivare il tuo account conferma il tuo indirizzo email:
                        </p>
                        <p style="margin:24px 0;text-align:center;">
                            <a th:href="${link}" href="#"
                               style="background:#0d6efd;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;display:inline-block;font-weight:bold;">
                                Conferma email
                            </a>
                        </p>
                        <p style="margin:0 0 8px;font-size:13px;color:#52606d;">
                            Se il pulsante non funziona copia questo link nel browser:
                        </p>
                        <p style="margin:0 0 16px;font-size:13px;word-break:break-all;">
                            <a th:href="${link}" th:text="${link}" href="#" style="color:#0d6efd;">link</a>
                        </p>
                        <p style="margin:0;font-size:13px;color:#52606d;">
                            Il link è valido per 24 ore. Se non hai creato tu l'account, ignora questa email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
