<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Salone Auto: vetture selezionate, nuove, km 0 e usate." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300..600&display=swap"
      rel="stylesheet"
    />
    <title>Salone Auto</title>
    <script>
      // Tema applicato prima del primo render (niente lampo bianco): scelta salvata, altrimenti quella del sistema
      (function () {
        var tema = 'light'
        try {
          var salvato = localStorage.getItem('salone.tema')
          tema = salvato === 'light' || salvato === 'dark' ? salvato
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-bs-theme', tema)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
